<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MSDRkulator - Jarak & Waktu</title>

<!-- FONT -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- ICON -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  overflow-x:hidden;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:25px;

  background:
  radial-gradient(circle at top left,#00e5ff 0%,transparent 25%),
  radial-gradient(circle at top right,#ff00c8 0%,transparent 25%),
  radial-gradient(circle at bottom left,#00ff88 0%,transparent 20%),
  radial-gradient(circle at bottom right,#8a2eff 0%,transparent 25%),
  linear-gradient(135deg,#030712,#071426,#0b1f3a);

  color:white;
  position:relative;
}

/* GRID */

body::before{
  content:'';
  position:fixed;
  inset:0;

  background-image:
  linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

  background-size:40px 40px;

  z-index:-2;
}

/* GLOW */

.glow1,
.glow2{
  position:fixed;
  border-radius:50%;
  filter:blur(120px);
  z-index:-1;
}

.glow1{
  width:320px;
  height:320px;
  background:#00d9ff;
  top:-100px;
  left:-100px;
  opacity:.5;
}

.glow2{
  width:340px;
  height:340px;
  background:#ff00b7;
  bottom:-120px;
  right:-100px;
  opacity:.45;
}

/* CONTAINER */

.container{
  width:100%;
  max-width:580px;
  position:relative;
  z-index:2;
}

/* BACK */

.back{
  display:inline-flex;
  align-items:center;
  gap:10px;

  margin-bottom:22px;

  text-decoration:none;
  color:white;

  padding:13px 22px;

  border-radius:16px;

  background:rgba(255,255,255,0.08);

  border:1px solid rgba(255,255,255,0.1);

  backdrop-filter:blur(12px);

  transition:.3s;
}

.back:hover{
  transform:translateY(-4px);

  background:linear-gradient(135deg,#00e5ff,#8a2eff);

  box-shadow:
  0 0 20px rgba(0,229,255,.3),
  0 0 40px rgba(138,46,255,.2);
}

/* CARD */

.card{
  position:relative;
  overflow:hidden;

  background:rgba(255,255,255,0.08);

  border:1px solid rgba(255,255,255,0.1);

  backdrop-filter:blur(18px);

  border-radius:35px;

  padding:35px;

  box-shadow:
  0 20px 60px rgba(0,0,0,.45),
  0 0 30px rgba(0,229,255,.1);
}

.card::before{
  content:'';
  position:absolute;

  width:250px;
  height:250px;

  border-radius:50%;

  background:rgba(255,255,255,0.04);

  top:-120px;
  right:-120px;
}

/* TITLE */

.title{
  text-align:center;

  font-size:38px;
  font-weight:700;

  margin-bottom:12px;
}

.title span{
  background:linear-gradient(to right,#00e5ff,#ff00c8,#8a2eff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.desc{
  text-align:center;

  color:#d4e6ff;

  line-height:1.8;

  margin-bottom:35px;
}

/* INPUT */

.input-group{
  margin-bottom:22px;
}

label{
  display:block;

  margin-bottom:12px;

  color:#d9ebff;

  font-weight:500;
}

.input-box{
  position:relative;
}

.input-box i{
  position:absolute;

  left:18px;
  top:50%;

  transform:translateY(-50%);

  color:#8cc7ff;

  font-size:18px;
}

input,
select{
  width:100%;

  padding:18px 18px 18px 52px;

  border:none;
  outline:none;

  border-radius:18px;

  background:rgba(0,0,0,0.25);

  color:white;

  font-size:17px;

  border:1px solid rgba(255,255,255,0.06);

  transition:.3s;
}

input:focus,
select:focus{
  border-color:#00e5ff;

  box-shadow:
  0 0 15px rgba(0,229,255,.2);
}

input::placeholder{
  color:#8fb8e6;
}

select{
  appearance:none;
}

/* BUTTON */

button{
  width:100%;

  padding:18px;

  border:none;
  outline:none;

  border-radius:18px;

  cursor:pointer;

  font-size:18px;
  font-weight:700;

  color:white;

  background:linear-gradient(135deg,#00e5ff,#8a2eff);

  transition:.35s;

  margin-top:10px;

  box-shadow:
  0 10px 25px rgba(0,0,0,.25);
}

button:hover{
  transform:translateY(-4px);

  box-shadow:
  0 0 25px rgba(0,229,255,.3),
  0 0 45px rgba(138,46,255,.2);
}

/* RESULT */

.hasil{
  margin-top:35px;

  background:rgba(0,0,0,0.22);

  border-radius:25px;

  padding:28px;

  border:1px solid rgba(255,255,255,0.06);
}

.hasil h2{
  text-align:center;

  margin-bottom:25px;

  font-size:28px;

  color:#9cd9ff;
}

/* RESULT ITEM */

.result-item{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:14px 0;

  border-bottom:1px solid rgba(255,255,255,0.06);
}

.result-item:last-child{
  border-bottom:none;
}

.result-label{
  color:#d9ecff;
}

.result-value{
  font-weight:600;
}

.result{
  color:#00ff9d;
  font-size:28px;
  font-weight:700;
}

/* PENJELASAN */

.penjelasan{
  margin-top:28px;

  padding:24px;

  border-radius:22px;

  background:rgba(255,255,255,0.05);

  line-height:2;

  color:#d4e6ff;

  border:1px solid rgba(255,255,255,0.06);
}

/* FOOTER */

.footer{
  margin-top:25px;

  text-align:center;

  color:#cfe3ff;

  font-size:14px;

  line-height:1.8;
}

/* RESPONSIVE */

@media(max-width:600px){

  .card{
    padding:25px;
  }

  .title{
    font-size:30px;
  }

  .hasil h2{
    font-size:24px;
  }

  .result{
    font-size:22px;
  }

}

</style>

</head>
<body>

<!-- GLOW -->
<div class="glow1"></div>
<div class="glow2"></div>

<div class="container">

<!-- BACK -->

<a href="index.html" class="back">
<i class="fa-solid fa-arrow-left"></i>
Kembali
</a>

<!-- CARD -->

<div class="card">

<h1 class="title">
🚗 <span>Jarak & Waktu</span>
</h1>

<p class="desc">
Hitung jarak atau waktu perjalanan
dengan tampilan modern futuristik.
</p>

<!-- MODE -->

<div class="input-group">

<label>Pilih Perhitungan</label>

<div class="input-box">

<i class="fa-solid fa-sliders"></i>

<select id="mode">

<option value="jarak">
Hitung Jarak
</option>

<option value="waktu">
Hitung Waktu
</option>

</select>

</div>

</div>

<!-- KECEPATAN -->

<div class="input-group">

<label>Kecepatan</label>

<div class="input-box">

<i class="fa-solid fa-gauge-high"></i>

<input
type="text"
id="kecepatan"
placeholder="Contoh: 60 km/jam">

</div>

</div>

<!-- INPUT -->

<div class="input-group">

<label id="labelInput">
Waktu
</label>

<div class="input-box">

<i class="fa-solid fa-road"></i>

<input
type="text"
id="nilai"
placeholder="Contoh: 2 jam">

</div>

</div>

<!-- BUTTON -->

<button onclick="hitung()">
<i class="fa-solid fa-calculator"></i>
Hitung Sekarang
</button>

<!-- RESULT -->

<div class="hasil">

<h2>
✨ Hasil Perhitungan
</h2>

<div class="result-item">

<div class="result-label">
Kecepatan
</div>

<div class="result-value" id="info1">
-
</div>

</div>

<div class="result-item">

<div class="result-label">
Data Input
</div>

<div class="result-value" id="info2">
-
</div>

</div>

<div class="result-item">

<div class="result-label">
Hasil
</div>

<div class="result" id="hasilAkhir">
-
</div>

</div>

<!-- PENJELASAN -->

<div class="penjelasan" id="penjelasan">

Masukkan data terlebih dahulu.

</div>

</div>

<!-- FOOTER -->

<div class="footer">
✨ MSDRkulator © 2026 <br>
Modern Neon Distance Calculator
</div>

</div>

</div>

<script>

// GANTI INPUT OTOMATIS

document.getElementById("mode")
.addEventListener("change", function(){

  let mode = this.value;

  let label =
  document.getElementById("labelInput");

  let input =
  document.getElementById("nilai");

  if(mode == "jarak"){

    label.innerHTML = "Waktu";

    input.placeholder =
    "Contoh: 2 jam";

  }

  else{

    label.innerHTML = "Jarak";

    input.placeholder =
    "Contoh: 120 km";

  }

});

function hitung(){

  let mode =
  document.getElementById("mode").value;

  let kecepatanInput =
  document.getElementById("kecepatan")
  .value.toLowerCase();

  if(!kecepatanInput.includes("km/jam")){

    alert("Kecepatan harus memakai km/jam");

    return;

  }

  let kecepatan =
  parseFloat(
  kecepatanInput.replace("km/jam","")
  );

  let nilaiInput =
  document.getElementById("nilai")
  .value.toLowerCase();

  let nilai;

  // ===================
  // HITUNG JARAK
  // ===================

  if(mode == "jarak"){

    if(
      !nilaiInput.includes("jam") &&
      !nilaiInput.includes("menit") &&
      !nilaiInput.includes("detik")
    ){

      alert(
      "Waktu harus memakai jam, menit, atau detik"
      );

      return;

    }

    nilai =
    parseFloat(nilaiInput);

    if(nilaiInput.includes("menit")){

      nilai = nilai / 60;

    }

    else if(nilaiInput.includes("detik")){

      nilai = nilai / 3600;

    }

    let jarak =
    kecepatan * nilai;

    document.getElementById("info1")
    .innerHTML =
    kecepatan + " km/jam";

    document.getElementById("info2")
    .innerHTML =
    nilaiInput;

    document.getElementById("hasilAkhir")
    .innerHTML =
    jarak.toFixed(2) + " km";

    document.getElementById("penjelasan")
    .innerHTML =

    "<b>📌 Penjelasan:</b><br><br>" +

    "Rumus menghitung jarak:<br><br>" +

    "<b>Jarak = Kecepatan × Waktu</b><br><br>" +

    kecepatan + " × " +

    nilai.toFixed(2) +

    " = " +

    jarak.toFixed(2) + " km";

  }

  // ===================
  // HITUNG WAKTU
  // ===================

  else{

    if(!nilaiInput.includes("km")){

      alert("Jarak harus memakai km");

      return;

    }

    nilai =
    parseFloat(
    nilaiInput.replace("km","")
    );

    let waktu =
    nilai / kecepatan;

    document.getElementById("info1")
    .innerHTML =
    kecepatan + " km/jam";

    document.getElementById("info2")
    .innerHTML =
    nilai + " km";

    document.getElementById("hasilAkhir")
    .innerHTML =
    waktu.toFixed(2) + " jam";

    document.getElementById("penjelasan")
    .innerHTML =

    "<b>📌 Penjelasan:</b><br><br>" +

    "Rumus menghitung waktu:<br><br>" +

    "<b>Waktu = Jarak ÷ Kecepatan</b><br><br>" +

    nilai + " ÷ " +

    kecepatan +

    " = " +

    waktu.toFixed(2) + " jam";

  }

}

</script>

</body>
</html>
