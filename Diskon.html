<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MSDRkulator - Diskon</title>

<!-- FONT -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- ICON -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  overflow-x:hidden;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:25px;

  background:
  radial-gradient(circle at top left,#00e5ff 0%,transparent 25%),
  radial-gradient(circle at top right,#ff00c8 0%,transparent 25%),
  radial-gradient(circle at bottom left,#00ff88 0%,transparent 20%),
  radial-gradient(circle at bottom right,#8a2eff 0%,transparent 25%),
  linear-gradient(135deg,#030712,#071426,#0b1f3a);

  color:white;
  position:relative;
}

/* GRID */

body::before{
  content:'';
  position:fixed;
  inset:0;

  background-image:
  linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

  background-size:40px 40px;

  z-index:-2;
}

/* GLOW */

.glow1,
.glow2{
  position:fixed;
  border-radius:50%;
  filter:blur(120px);
  z-index:-1;
}

.glow1{
  width:320px;
  height:320px;
  background:#00d9ff;
  top:-100px;
  left:-100px;
  opacity:.5;
}

.glow2{
  width:340px;
  height:340px;
  background:#ff00b7;
  bottom:-120px;
  right:-100px;
  opacity:.45;
}

/* CONTAINER */

.container{
  width:100%;
  max-width:550px;
  position:relative;
  z-index:2;
}

/* BACK */

.back{
  display:inline-flex;
  align-items:center;
  gap:10px;

  margin-bottom:22px;

  text-decoration:none;
  color:white;

  padding:13px 22px;

  border-radius:16px;

  background:rgba(255,255,255,0.08);

  border:1px solid rgba(255,255,255,0.1);

  backdrop-filter:blur(12px);

  transition:.3s;
}

.back:hover{
  transform:translateY(-4px);

  background:linear-gradient(135deg,#00e5ff,#8a2eff);

  box-shadow:
  0 0 20px rgba(0,229,255,.3),
  0 0 40px rgba(138,46,255,.2);
}

/* CARD */

.card{
  position:relative;
  overflow:hidden;

  background:rgba(255,255,255,0.08);

  border:1px solid rgba(255,255,255,0.1);

  backdrop-filter:blur(18px);

  border-radius:35px;

  padding:35px;

  box-shadow:
  0 20px 60px rgba(0,0,0,.45),
  0 0 30px rgba(0,229,255,.1);
}

.card::before{
  content:'';
  position:absolute;

  width:250px;
  height:250px;

  border-radius:50%;

  background:rgba(255,255,255,0.04);

  top:-120px;
  right:-120px;
}

/* TITLE */

.title{
  text-align:center;

  font-size:38px;
  font-weight:700;

  margin-bottom:12px;
}

.title span{
  background:linear-gradient(to right,#00e5ff,#ff00c8,#8a2eff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.desc{
  text-align:center;

  color:#d4e6ff;

  line-height:1.8;

  margin-bottom:35px;
}

/* INPUT */

.input-group{
  margin-bottom:22px;
}

label{
  display:block;

  margin-bottom:12px;

  color:#d9ebff;

  font-weight:500;
}

.input-box{
  position:relative;
}

.input-box i{
  position:absolute;

  left:18px;
  top:50%;

  transform:translateY(-50%);

  color:#8cc7ff;

  font-size:18px;
}

input{
  width:100%;

  padding:18px 18px 18px 50px;

  border:none;
  outline:none;

  border-radius:18px;

  background:rgba(0,0,0,0.25);

  color:white;

  font-size:17px;

  border:1px solid rgba(255,255,255,0.06);

  transition:.3s;
}

input:focus{
  border-color:#00e5ff;

  box-shadow:
  0 0 15px rgba(0,229,255,.2);
}

input::placeholder{
  color:#8fb8e6;
}

/* BUTTON */

button{
  width:100%;

  padding:18px;

  border:none;
  outline:none;

  border-radius:18px;

  cursor:pointer;

  font-size:18px;
  font-weight:700;

  color:white;

  background:linear-gradient(135deg,#00e5ff,#8a2eff);

  transition:.35s;

  margin-top:10px;

  box-shadow:
  0 10px 25px rgba(0,0,0,.25);
}

button:hover{
  transform:translateY(-4px);

  box-shadow:
  0 0 25px rgba(0,229,255,.3),
  0 0 45px rgba(138,46,255,.2);
}

/* RESULT */

.hasil{
  margin-top:35px;

  background:rgba(0,0,0,0.22);

  border-radius:25px;

  padding:28px;

  border:1px solid rgba(255,255,255,0.06);
}

.hasil h2{
  text-align:center;

  margin-bottom:25px;

  font-size:28px;

  color:#9cd9ff;
}

/* RESULT ITEM */

.result-item{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:14px 0;

  border-bottom:1px solid rgba(255,255,255,0.06);
}

.result-item:last-child{
  border-bottom:none;
}

.result-label{
  color:#d9ecff;
}

.result-value{
  font-weight:600;
}

.total{
  color:#00ff9d;
  font-size:28px;
  font-weight:700;
}

/* PENJELASAN */

.penjelasan{
  margin-top:28px;

  padding:24px;

  border-radius:22px;

  background:rgba(255,255,255,0.05);

  line-height:2;

  color:#d4e6ff;

  border:1px solid rgba(255,255,255,0.06);
}

/* FOOTER */

.footer{
  margin-top:25px;

  text-align:center;

  color:#cfe3ff;

  font-size:14px;

  line-height:1.8;
}

/* RESPONSIVE */

@media(max-width:600px){

  .card{
    padding:25px;
  }

  .title{
    font-size:30px;
  }

  .hasil h2{
    font-size:24px;
  }

  .total{
    font-size:22px;
  }

}

</style>

</head>
<body>

<!-- GLOW -->
<div class="glow1"></div>
<div class="glow2"></div>

<div class="container">

<!-- BACK -->

<a href="index.html" class="back">
<i class="fa-solid fa-arrow-left"></i>
Kembali
</a>

<!-- CARD -->

<div class="card">

<h1 class="title">
💸 <span>Kalkulator Diskon</span>
</h1>

<p class="desc">
Hitung potongan harga dan total pembayaran
dengan tampilan modern futuristik.
</p>

<!-- INPUT -->

<div class="input-group">

<label>Harga Awal</label>

<div class="input-box">

<i class="fa-solid fa-money-bill-wave"></i>

<input
type="text"
id="harga"
placeholder="Contoh: 50000">

</div>

</div>

<div class="input-group">

<label>Diskon (%)</label>

<div class="input-box">

<i class="fa-solid fa-percent"></i>

<input
type="text"
id="diskon"
placeholder="Contoh: 10%">

</div>

</div>

<button onclick="hitungDiskon()">
<i class="fa-solid fa-calculator"></i>
Hitung Diskon
</button>

<!-- RESULT -->

<div class="hasil">

<h2>
✨ Hasil Perhitungan
</h2>

<div class="result-item">

<div class="result-label">
Harga Awal
</div>

<div class="result-value" id="hargaAwal">
Rp0
</div>

</div>

<div class="result-item">

<div class="result-label">
Diskon
</div>

<div class="result-value" id="diskonPersen">
0%
</div>

</div>

<div class="result-item">

<div class="result-label">
Potongan Harga
</div>

<div class="result-value" id="potongan">
Rp0
</div>

</div>

<div class="result-item">

<div class="result-label">
Total Bayar
</div>

<div class="total" id="total">
Rp0
</div>

</div>

<!-- PENJELASAN -->

<div class="penjelasan" id="penjelasan">

Masukkan harga dan diskon terlebih dahulu.

</div>

</div>

<div class="footer">
✨ MSDRkulator © 2026 <br>
Modern Neon Discount Calculator
</div>

</div>

</div>

<script>

function hitungDiskon(){

  let hargaInput =
  document.getElementById("harga").value;

  let harga =
  parseFloat(hargaInput.replace(/\./g,""));

  let diskonInput =
  document.getElementById("diskon").value;

  if(!diskonInput.includes("%")){

    alert("Diskon harus memakai tanda %");

    return;

  }

  let diskon =
  parseFloat(diskonInput.replace("%",""));

  if(isNaN(harga) || isNaN(diskon)){

    alert("Masukkan angka dengan benar!");

    return;

  }

  let potongan =
  harga * diskon / 100;

  let total =
  harga - potongan;

  let formatHarga =
  harga.toLocaleString("id-ID");

  let formatPotongan =
  potongan.toLocaleString("id-ID");

  let formatTotal =
  total.toLocaleString("id-ID");

  document.getElementById("hargaAwal").innerHTML =
  "Rp" + formatHarga;

  document.getElementById("diskonPersen").innerHTML =
  diskon + "%";

  document.getElementById("potongan").innerHTML =
  "Rp" + formatPotongan;

  document.getElementById("total").innerHTML =
  "Rp" + formatTotal;

  document.getElementById("penjelasan").innerHTML =

  "<b>📌 Penjelasan:</b><br><br>" +

  "Potongan harga dihitung menggunakan rumus:<br><br>" +

  "<b>Harga × Diskon ÷ 100</b><br><br>" +

  "Rp" + formatHarga +

  " × " + diskon + "% ÷ 100 = Rp" +

  formatPotongan +

  "<br><br>" +

  "Kemudian total pembayaran dihitung:<br><br>" +

  "<b>Harga Awal - Potongan</b><br><br>" +

  "Rp" + formatHarga +

  " - Rp" + formatPotongan +

  " = Rp" + formatTotal;

}

</script>

</body>
</html>
